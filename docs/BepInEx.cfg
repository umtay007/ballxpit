## Starting settings for BepInEx, shipped with BALLxPIT Online Co-op. BepInEx adds the rest of its
## settings to this file the first time the game starts.

[Logging]

## Needed for Unity 6 games such as BALL x PIT: BepInEx's Unity log hook doesn't work there.
# Setting type: Boolean
# Default value: true
UnityLogListening = false

[Logging.Disk]

## Write each log line straight away, so LogOutput.log is complete even if the game closes suddenly.
# Setting type: Boolean
# Default value: false
InstantFlushing = true
